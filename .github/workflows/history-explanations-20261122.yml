{
  "name": "Web verification",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24",
            "cache": "npm"
          }
        },
        {
          "name": "Install verified dependencies",
          "run": "npm ci"
        },
        {
          "name": "All web regression tests",
          "run": "npm test"
        },
        {
          "name": "Validate all reviewed explanations and the full production question dataset",
          "run": "node scripts/verify-history-explanations.mjs"
        },
        {
          "name": "Build the currently approved rebuild_v1 app and 1,536 question details",
          "run": "node scripts/build-web.mjs --history-public-config config/history-public-rebuild.json"
        },
        {
          "name": "Ensure the 22-column explanations asset is present",
          "run": "node -e \"const fs=require('fs'); const data=JSON.parse(fs.readFileSync('dist/web/history-quiz-details.json')); if(Object.keys(data.details).length!==1536 || Object.values(data.details).filter(x=>x.reviewedExplanation).length!==109)process.exit(1); console.log('1536 questions, 109 reviewed explanations');\""
        },
        {
          "name": "Archive tested review build",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "history-explanations-review-${{ github.run_id }}",
            "path": "dist/web",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
