{
  "name": "History explanation consolidation release",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ],
      "paths": [
        "history_questions.js",
        "scripts/history-quiz-details.mjs",
        "scripts/verify-history-explanations.mjs",
        "tests/history_questions.test.mjs",
        "data/history-explanations-curated.json",
        ".github/workflows/history-explanations-20261122.yml"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "docs/ai-handoff/HISTORY_EXPLANATION_RELEASE_20261122.md"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "vocabulary-app-history-explanation-production",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "pages": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "24",
            "cache": "npm"
          }
        },
        {
          "name": "Install verified dependencies",
          "run": "npm ci"
        },
        {
          "name": "All web regression tests",
          "run": "npm test"
        },
        {
          "name": "Validate all reviewed explanations and the full production question dataset",
          "run": "node scripts/verify-history-explanations.mjs"
        },
        {
          "name": "Confirm the existing Pages publishing source",
          "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "node scripts/check-pages-release.mjs"
        },
        {
          "name": "Build the currently approved rebuild_v1 app and 1,536 question details",
          "run": "node scripts/build-web.mjs --history-public-config config/history-public-rebuild.json"
        },
        {
          "name": "Ensure the 22-column explanations asset is present",
          "run": "node -e \"const fs=require('fs'); const data=JSON.parse(fs.readFileSync('dist/web/history-quiz-details.json')); if(Object.keys(data.details).length!==1536 || Object.values(data.details).filter(x=>x.reviewedExplanation).length!==109)process.exit(1); console.log('1536 questions, 109 reviewed explanations');\""
        },
        {
          "name": "Archive tested review build",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "history-explanations-review-${{ github.run_id }}",
            "path": "dist/web",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Upload production artifact only on authorized main integration",
          "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "name": "github-pages-history-explanations-${{ github.run_id }}",
            "path": "dist/web"
          }
        }
      ]
    },
    "deploy": {
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
      "needs": "verify",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Publish verified history explanation build",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4",
          "with": {
            "artifact_name": "github-pages-history-explanations-${{ github.run_id }}"
          }
        }
      ]
    }
  }
}
