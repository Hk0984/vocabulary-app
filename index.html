<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>単語学習</title>

    <meta name="theme-color" content="#333333">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="単語学習">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>単語学習</h1>

    <nav>

        <button onclick="showPage('studyPage')">
            学習
        </button>

        <button onclick="showPage('progressPage')">
            学習状況
        </button>

    </nav>

</header>


<main>


<!-- ========================================
     ジャンル選択
======================================== -->

<section id="sheetPage">

    <div class="sheet-box">

        <h2>出題するジャンルを選択</h2>

        <div id="sheetList"></div>

        <button
            id="startButton"
            onclick="startStudy()"
            disabled
        >
            次へ
        </button>

    </div>

</section>


<!-- ========================================
     学習設定
======================================== -->

<section
    id="settingsPage"
    style="display: none;"
>

    <div class="settings-box">

        <h2>学習設定</h2>


        <div class="setting-section">

            <h3>学習モード</h3>

            <div class="setting-options">

                <button
                    class="setting-option selected"
                    data-setting="mode"
                    data-value="normal"
                    onclick="selectSetting(this)"
                >
                    <strong>通常学習</strong>
                    <span>すべての単語から出題</span>
                </button>


                <button
                    class="setting-option"
                    data-setting="mode"
                    data-value="weak"
                    onclick="selectSetting(this)"
                >
                    <strong>苦手単語</strong>
                    <span>誤答率41%以上の単語</span>
                </button>


                <button
                    class="setting-option"
                    data-setting="mode"
                    data-value="unlearned"
                    onclick="selectSetting(this)"
                >
                    <strong>未学習単語</strong>
                    <span>まだ回答したことのない単語</span>
                </button>


                <button
                    class="setting-option"
                    data-setting="mode"
                    data-value="incorrect"
                    onclick="selectSetting(this)"
                >
                    <strong>間違えた単語</strong>
                    <span>1回でも間違えたことのある単語</span>
                </button>

            </div>

        </div>


        <div class="setting-section">

            <h3>出題形式</h3>

            <div class="setting-options horizontal">

                <button
                    class="setting-option selected"
                    data-setting="format"
                    data-value="enToJa"
                    onclick="selectSetting(this)"
                >
                    <strong>英語 → 日本語</strong>
                </button>


                <button
                    class="setting-option"
                    data-setting="format"
                    data-value="jaToEn"
                    onclick="selectSetting(this)"
                >
                    <strong>日本語 → 英語</strong>
                </button>

            </div>

        </div>


        <div class="setting-section">

            <h3>問題数</h3>

            <div class="setting-options horizontal">

                <button
                    class="setting-option selected"
                    data-setting="count"
                    data-value="10"
                    onclick="selectSetting(this)"
                >
                    <strong>10問</strong>
                </button>


                <button
                    class="setting-option"
                    data-setting="count"
                    data-value="20"
                    onclick="selectSetting(this)"
                >
                    <strong>20問</strong>
                </button>


                <button
                    class="setting-option"
                    data-setting="count"
                    data-value="50"
                    onclick="selectSetting(this)"
                >
                    <strong>50問</strong>
                </button>


                <button
                    class="setting-option"
                    data-setting="count"
                    data-value="unlimited"
                    onclick="selectSetting(this)"
                >
                    <strong>無制限</strong>
                </button>

            </div>

        </div>


        <div
            id="settingsMessage"
            class="settings-message"
        ></div>


        <button
            id="beginStudyButton"
            onclick="beginStudy()"
            disabled
        >
            学習開始
        </button>


        <button
            class="back-button"
            onclick="backToSheetSelection()"
        >
            ジャンル選択に戻る
        </button>

    </div>

</section>


<!-- ========================================
     学習
======================================== -->

<section
    id="studyPage"
    style="display: none;"
>

    <div class="current-sheet">

        <span>
            出題中：
            <strong id="currentSheetName">-</strong>
        </span>

        <button
            onclick="showPage('settingsPage')"
            class="change-sheet-button"
        >
            設定変更
        </button>

        <button
            onclick="changeStudySheet()"
            class="change-sheet-button"
        >
            ジャンル変更
        </button>

    </div>


    <div
        id="sessionInfo"
        class="session-info"
    >

        <span id="sessionProgress">
            0 / 10問
        </span>

        <span id="sessionAccuracy">
            正答率 0%
        </span>

    </div>


    <div class="question-box">

        <div id="questionType">
            英語 → 日本語
        </div>

        <div id="question">
            読み込み中...
        </div>

    </div>


    <div id="choices"></div>


    <div id="result"></div>


    <button
        id="nextButton"
        onclick="nextQuestion()"
        style="display: none;"
    >
        次の問題
    </button>


    <button
        id="reviewButton"
        onclick="startWrongReview()"
        style="display: none;"
    >
        間違えた単語を復習
    </button>

</section>


<!-- ========================================
     学習状況
======================================== -->

<section
    id="progressPage"
    style="display: none;"
>

    <div class="settings-box">

        <h2>学習状況を見るジャンル</h2>

        <div id="progressSheetList"></div>

    </div>


    <div class="current-sheet">

        学習状況：
        <strong id="progressSheetName">-</strong>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                総問題数
            </div>

            <div
                id="totalQuestions"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                全体正答率
            </div>

            <div
                id="overallAccuracy"
                class="stat-value"
            >
                0%
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                現在の連続正解
            </div>

            <div
                id="currentStreak"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                最高連続正解
            </div>

            <div
                id="bestStreak"
                class="stat-value"
            >
                0
            </div>

        </div>

    </div>


    <h2>
        単語の学習状況
    </h2>


    <div class="buckets">

        <div class="bucket">

            <div>
                誤答率 0～20%
            </div>

            <strong id="bucket0">
                0単語
            </strong>

        </div>


        <div class="bucket">

            <div>
                誤答率 21～40%
            </div>

            <strong id="bucket1">
                0単語
            </strong>

        </div>


        <div class="bucket">

            <div>
                誤答率 41～60%
            </div>

            <strong id="bucket2">
                0単語
            </strong>

        </div>


        <div class="bucket">

            <div>
                誤答率 61～80%
            </div>

            <strong id="bucket3">
                0単語
            </strong>

        </div>


        <div class="bucket">

            <div>
                誤答率 81～100%
            </div>

            <strong id="bucket4">
                0単語
            </strong>

        </div>


        <div class="bucket">

            <div>
                未学習
            </div>

            <strong id="bucket5">
                0単語
            </strong>

        </div>

    </div>


    <!-- ========================================
         単語別学習状況
    ======================================== -->

    <div class="word-progress-header">

        <h2>
            単語別の学習状況
        </h2>

        <select
            id="wordSortSelect"
            onchange="renderWordProgress()"
        >

            <option value="weak">
                苦手順
            </option>

            <option value="accuracy">
                正答率順
            </option>

            <option value="questions">
                出題回数順
            </option>

            <option value="unlearned">
                未学習を上に
            </option>

            <option value="alphabetical">
                英単語順
            </option>

        </select>

    </div>


    <div
        id="wordProgressList"
        class="word-progress-list"
    ></div>


    <button
        id="resetButton"
        onclick="resetProgress()"
    >
        このジャンルの学習履歴をリセット
    </button>

</section>


</main>


<script src="script.js"></script>

</body>

</html>
